[package]
name = "ironclaw_mcp"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
ironclaw_extensions = { path = "../ironclaw_extensions" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_resources = { path = "../ironclaw_resources" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
